<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>/* meletakkan style di sini dari css */
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: arial, sans-serif;
    }
    .container{ /* setiap class menggunakan tanda titik di awal */
        border: 2px solid orange;    
        max-width: 50%;
        margin: 20px auto;
    }
    header, footer{
        background-color: #ffe5cc;
        text-align: center;
        padding: 30px;
    }
    nav{
        background-color: #cfe2f3;
        text-align: center;
        padding: 15px;
        border-top: 1px solid gray;
        border-bottom: 1px solid gray;
    }
    .main-area{
        display: flex;
        border-bottom: 1px solid gray; 
        height: 300px;

    }   
    .content{
        background-color: #f4cccc; 
        flex: 7;
        padding: 80px;
        border-right: 1px solid gray;
    }
    .sidebar{
        flex: 1;
        background-color: #d9ead3 ;
        padding: 90px;
    }   



    </style>
    <title>Latihan Layout</title>
</head>

<body>
    <div class="container"> 
        <header>HEADER</header>

        <nav>NAVIGATION</nav>
        
        <div class ="main-area"> 
            <section class ="content">
                <h1> Heading 1 </h1>
                <P>Lorem ipsum dolor sit amet, consectetur</P>
                <p>adipisicing elit, sed do eiusmod tempor </p>
                <p>incididunt ut labore et dolore magna aliqua.</p>
            </section>

            <aside class ="sidebar">
                <strong>Menu:</strong>
                <ul>
                    <li>Home</li>
                    <li>Berita</li>
                    <li>Layanan</li>
                    <li>Kontak</li>
                </ul>   
            </aside>
        </div>

        <footer>FOOTER</footer>
        
    </div>
       

</body>
</html>
